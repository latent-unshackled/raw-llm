<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="16" fill="#030712"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#0b0f19" stroke="url(#cyan-red-grad)" stroke-width="1.5" stroke-opacity="0.8"/>
  
  <defs>
    <linearGradient id="cyan-red-grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Central Chip Body -->
  <rect x="18" y="18" width="28" height="28" rx="6" fill="#0f172a" stroke="#06b6d4" stroke-width="2" filter="url(#glow)"/>
  
  <!-- Core Element -->
  <path d="M26 22H38V34H26V22Z" fill="url(#cyan-red-grad)" opacity="0.9"/>
  <circle cx="32" cy="32" r="3" fill="#ffffff"/>

  <!-- CPU Pins -->
  <path d="M24 12V18M32 12V18M40 12V18" stroke="#06b6d4" stroke-width="2" stroke-linecap="round"/>
  <path d="M24 46V52M32 46V52M40 46V52" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
  <path d="M12 24H18M12 32H18M12 40H18" stroke="#06b6d4" stroke-width="2" stroke-linecap="round"/>
  <path d="M46 24H52M46 32H52M46 40H52" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
</svg>
